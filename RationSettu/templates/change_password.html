<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - RationSetu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="navbar-left">
        <button class="hamburger">☰</button>
        <span class="nav-home-text">Home</span>
    </div>
    <a href="{{ url_for('index') }}" class="navbar-brand">
        <span class="logo-icon">🌾</span>
        <span class="brand-name">RationSetu</span>
    </a>
    <div class="navbar-right">
        <span class="login-as-text">Login as Admin</span>
        <span class="user-icon">👤</span>
        <a href="{{ url_for('logout') }}">
            <button class="logout-btn">Logout</button>
        </a>
    </div>
</nav>

<div class="admin-layout">
    <div class="sidebar">
        <img src="{{ url_for('static', filename='img/pic1.jpg') }}"
             alt="Profile" class="sidebar-img">
        <div class="sidebar-menu">
            <a href="{{ url_for('change_password') }}" class="sidebar-link active">🔒 Change Password</a>
            <a href="{{ url_for('dashboard') }}" class="sidebar-link">🏠 Home</a>
            <a href="{{ url_for('manage_users') }}" class="sidebar-link">👥 Manage Users</a>
            <a href="{{ url_for('ration_distribution') }}" class="sidebar-link">🌾 Distribution</a>
        </div>
    </div>

    <div class="main-content">
        <div class="page-header">
            <span>➤</span>
            <h2 class="page-title">Change Password</h2>
        </div>

        <div class="change-pwd-card">
            {% if message %}
                {% if 'successfully' in message %}
                    <div class="success-msg">✅ {{ message }}</div>
                {% else %}
                    <div class="error-msg">❌ {{ message }}</div>
                {% endif %}
            {% endif %}

            <form method="POST" action="{{ url_for('change_password') }}">
                <div class="form-group">
                    <label>Old Password</label>
                    <input type="password" name="old_password"
                           class="form-control" required
                           placeholder="Enter old password">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="new_password"
                           class="form-control" required
                           placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password"
                           class="form-control" required
                           placeholder="Confirm new password">
                </div>
                <button type="submit" class="submit-btn">
                    🔒 Update Password
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
